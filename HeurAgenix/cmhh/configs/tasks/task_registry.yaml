version: 1
description: >
  CM-HH task registry. A task is a problem, size tier, data distribution,
  fixed data split, reference file, and evaluation metric.
tasks:
  - task_id: tsp_n20_uniform
    problem: tsp
    implemented_in_heuragenix: true
    size_tier: n20
    distribution: euclidean_uniform
    splits:
      train: cmhh/data/instances/tsp_n20_uniform/train
      validation: cmhh/data/instances/tsp_n20_uniform/validation
      test: cmhh/data/instances/tsp_n20_uniform/test
      smoke: cmhh/data/instances/tsp_n20_uniform/smoke
    reference:
      type: best_known
      path: cmhh/data/references/tsp_n20_uniform/reference.json
      status: pending
    metric:
      name: relative_gap
      objective: minimize
      aggregation: mean
    baseline_pool:
      heuristic_dir: basic_heuristics
      seed_heuristics:
        - nearest_neighbor_f91d
        - random_80a0
        - greedy_algorithm_3ca7
    metadata:
      nodes: 20
      stream_families: [within_problem_size, mixed_problem_size]

