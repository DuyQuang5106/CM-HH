version: 1
problems:
  tsp:
    display_name: Traveling Salesman Problem
    heuragenix_problem: tsp
    objective: minimize
    key_item: current_cost
    default_metric: relative_gap
    default_distribution: euclidean_uniform
    default_heuristic_dir: basic_heuristics
  pfsp:
    display_name: Permutation Flow Shop Scheduling Problem
    heuragenix_problem: null
    objective: minimize
    key_item: makespan
    default_metric: relative_gap
    default_distribution: uniform_processing_times
    default_heuristic_dir: basic_heuristics
    adapter_status: missing
  obp:
    display_name: Online Bin Packing
    heuragenix_problem: null
    objective: minimize
    key_item: bins_used
    default_metric: relative_gap
    default_distribution: uniform_item_sizes
    default_heuristic_dir: basic_heuristics
    adapter_status: missing
  cvrp:
    display_name: Capacitated Vehicle Routing Problem
    heuragenix_problem: cvrp
    objective: minimize
    key_item: total_current_cost
    default_metric: relative_gap
    default_distribution: euclidean_uniform
    default_heuristic_dir: basic_heuristics
  jssp:
    display_name: Job Shop Scheduling Problem
    heuragenix_problem: jssp
    objective: minimize
    key_item: current_makespan
    default_metric: relative_gap
    default_distribution: uniform_processing_times
    default_heuristic_dir: basic_heuristics


