version: 1
experiment:
  name: h1_naive_sequential
  condition: naive_memory_sequential
  output_root: cmhh/results
  seeds: [1, 2, 3]
archive:
  policy: naive_overwrite
  capacity: 20
  top_k: 5
  candidate_top_k: 5
  memory_seed_quota: 1
  direct_reuse_quota: 1
  refine_quota: 4
data:
  seed: 42
  coordinate_min: 0
  coordinate_max: 10000
  splits:
    train: 20
    validation: 10
    test: 30
    smoke: 2
search:
  generations: 2
  candidates_per_generation: 3
  max_llm_calls: 10
evaluation:
  instance_timeout_seconds: 10
  batch_timeout_seconds: 300
  invalid_policy: fail_batch

